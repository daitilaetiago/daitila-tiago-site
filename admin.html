<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Daitila & Tiago</title><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--paper:#FAF8F4;--ink:#34332f;--gold:#C8A46A;--muted:#77736c;--line:rgba(52,51,47,.13)}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Poppins,Arial,sans-serif}.wrap{width:min(1180px,calc(100% - 36px));margin:auto}.top{display:flex;justify-content:space-between;align-items:center;padding:25px 0;border-bottom:1px solid var(--line)}.brand{display:flex;gap:12px;align-items:center;font-weight:700;font-size:.82rem}.seal{display:grid;place-items:center;width:43px;height:43px;border:1px solid var(--gold);border-radius:50%;font:italic 1rem 'Playfair Display',serif;color:#98733f}.top a{color:#98733f;font-size:.75rem}.gate{max-width:390px;margin:14vh auto;padding:32px;background:#fff;border:1px solid var(--line);box-shadow:0 20px 50px rgba(80,60,30,.08)}h1,h2{font-family:'Playfair Display',serif;font-weight:500}h1{font-size:2.5rem;line-height:1;margin:15px 0 10px}.muted{color:var(--muted);font-size:.82rem}.field{display:grid;gap:7px;margin:18px 0}.field label{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.field input{padding:12px;border:1px solid var(--line);background:var(--paper);outline:none}.btn{border:0;border-radius:999px;padding:12px 17px;background:var(--ink);color:#fff;font:700 .74rem Poppins;cursor:pointer}.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}.status{color:#98733f;min-height:1.3em;font-size:.75rem;margin-top:8px}.dashboard{display:none;padding:50px 0 80px}.dashboard.visible{display:block}.dashboard-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}.dashboard h1{margin:0}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.tools input,.tools select{padding:11px 12px;border:1px solid var(--line);background:#fff;outline:none}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line)}table{width:100%;border-collapse:collapse;min-width:900px;font-size:.75rem}th,td{text-align:left;padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:top}th{color:#98733f;font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;background:#fcfaf6}tr:last-child td{border:0}.empty{text-align:center;padding:40px;color:var(--muted)}.summary{display:flex;gap:22px;flex-wrap:wrap;margin:20px 0}.metric{padding:15px 18px;background:#fff;border:1px solid var(--line);min-width:130px}.metric b{display:block;font:1.8rem 'Playfair Display',serif}.metric span{color:var(--muted);font-size:.7rem}</style></head><body><header class="top wrap"><div class="brand"><span class="seal">D&T</span><span>Área administrativa<br><small style="color:#77736c;font-weight:400">Lista de presentes</small></span></div><a href="index.html">← Ver site</a></header><main class="wrap"><section class="gate" id="gate"><div class="seal">D&T</div><h1>Olá, Daitila.</h1><p class="muted">Acesse o acompanhamento dos presentes escolhidos.</p><div class="field"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" placeholder="Digite a senha"></div><button class="btn" id="login">Entrar</button><div class="status" id="login-status"></div></section><section class="dashboard" id="dashboard"><div class="dashboard-head"><div><div class="muted">Visão geral</div><h1>Presentes recebidos</h1></div><button class="btn alt" id="logout">Sair</button></div><div class="summary"><div class="metric"><b id="total">0</b><span>contribuições</span></div><div class="metric"><b id="people">0</b><span>pessoas</span></div></div><div class="tools"><input id="search" placeholder="Pesquisar nome, WhatsApp ou presente"><select id="filter"><option value="">Todos os presentes</option></select><button class="btn" id="csv">Exportar CSV</button></div><div class="table-wrap"><table><thead><tr><th>Nome</th><th>WhatsApp</th><th>Presente</th><th>Valor</th><th>Data</th><th>Hora</th><th>Observação</th><th>Comprovante</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>const PASSWORD='daitila2026';let entries=[];const $=id=>document.getElementById(id);function read(){try{return JSON.parse(localStorage.getItem('daitila_gifts')||'[]')}catch(e){return[]}}function render(){const q=$('search').value.toLowerCase(),filter=$('filter').value;const data=entries.filter(e=>(!filter||e.presente===filter)&&(!q||Object.values(e).join(' ').toLowerCase().includes(q)));$('total').textContent=entries.length;$('people').textContent=new Set(entries.map(e=>e.whatsapp)).size;$('rows').innerHTML=data.length?data.map(e=>`<tr><td>${esc(e.nome)}</td><td>${esc(e.whatsapp)}</td><td>${esc(e.presente)}</td><td>${esc(e.valor)}</td><td>${esc(e.data)}</td><td>${esc(e.hora)}</td><td>${esc(e.observacao||'—')}</td><td>${esc(e.comprovante||'—')}</td></tr>`).join(''):'<tr><td colspan="8" class="empty">Nenhum registro encontrado.</td></tr>'}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function openDash(){entries=read();const values=[...new Set(entries.map(e=>e.presente).filter(Boolean))];$('filter').innerHTML='<option value="">Todos os presentes</option>'+values.map(v=>`<option>${esc(v)}</option>`).join('');$('gate').style.display='none';$('dashboard').classList.add('visible');render()}$('login').onclick=()=>{if($('password').value===PASSWORD)openDash();else $('login-status').textContent='Senha incorreta.'};$('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('login').click()});$('logout').onclick=()=>{location.reload()};$('search').oninput=render;$('filter').onchange=render;$('csv').onclick=()=>{const header=['Nome','WhatsApp','Presente','Valor','Data','Hora','Observação','Comprovante'];const lines=[header,...entries.map(e=>[e.nome,e.whatsapp,e.presente,e.valor,e.data,e.hora,e.observacao||'',e.comprovante||''])].map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';'));const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='presentes-daitila-tiago.csv';a.click();URL.revokeObjectURL(url)};</script></body></html>
